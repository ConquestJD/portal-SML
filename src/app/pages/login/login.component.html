<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-placeholder">
        <span class="logo-icon">🏫</span>
      </div>
      <h1 class="login-title">Portal Estudiantil</h1>
      <p class="login-subtitle">Bienvenido de vuelta</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (error()) {
        <div class="alert alert-error">
          <span>⚠️</span>
          <span>{{ error() }}</span>
        </div>
      }

      <div class="form-group">
        <label for="username" class="form-label">Usuario o Email</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            id="username"
            type="text"
            class="form-input"
            placeholder="Código de estudiante o email"
            [(ngModel)]="username"
            [disabled]="isLoading()"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            [disabled]="isLoading()"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading()"
          >
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            [disabled]="isLoading()"
          />
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-link" (click)="forgotPassword(); $event.preventDefault()">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p class="footer-text">
        ¿Necesitas ayuda? <a href="#" class="help-link">Contacta con soporte</a>
      </p>
      <p class="footer-year">Año Académico 2024</p>
    </div>
  </div>
</div>
