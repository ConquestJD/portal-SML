<div class="prof-page">

  <header class="prof-page__hero">
    <img class="prof-page__hero-photo" src="/images/fondo.webp" alt="" decoding="async" />
    <div class="prof-page__hero-veil"></div>
    <div class="prof-page__hero-content">
      <img src="/only-logo.png" alt="" class="prof-page__crest" />
      <div>
        <h1 class="prof-page__title">Configuración</h1>
        <p class="prof-page__brand">Santa María Laura</p>
      </div>
    </div>
  </header>

  <div class="prof-page__body">

    @if (isLoading()) {
      <p class="feed__empty">Cargando configuración…</p>
    } @else {

      <form (ngSubmit)="saveSettings()" class="cfg-form">

        <section class="feed cfg-section">
          <div class="feed__head">
            <h2>Notificaciones</h2>
          </div>
          <p class="cfg-hint">Configura cómo y cuándo recibir notificaciones importantes.</p>

          <ul class="cfg-list">
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Notificaciones por email</span>
                  <span class="cfg-item__desc">Recibe notificaciones importantes por correo electrónico</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().emailNotifications"
                  (ngModelChange)="updateEmailNotifications($event)"
                  name="emailNotifications"
                />
              </label>
            </li>
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Notificaciones por SMS</span>
                  <span class="cfg-item__desc">Recibe alertas importantes por mensaje de texto</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().smsNotifications"
                  (ngModelChange)="updateSmsNotifications($event)"
                  name="smsNotifications"
                />
              </label>
            </li>
          </ul>

          <ul class="cfg-list cfg-list--group">
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Nuevas tareas</span>
                  <span class="cfg-item__desc">Notificarme cuando se creen nuevas tareas en mis cursos</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().newTasks"
                  (ngModelChange)="updateNewTasks($event)"
                  name="newTasks"
                />
              </label>
            </li>
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Entregas de tareas</span>
                  <span class="cfg-item__desc">Notificarme cuando los estudiantes entreguen tareas</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().taskSubmissions"
                  (ngModelChange)="updateTaskSubmissions($event)"
                  name="taskSubmissions"
                />
              </label>
            </li>
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Comunicados urgentes</span>
                  <span class="cfg-item__desc">Recibir notificaciones de comunicados marcados como urgentes</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().urgentAnnouncements"
                  (ngModelChange)="updateUrgentAnnouncements($event)"
                  name="urgentAnnouncements"
                />
              </label>
            </li>
            <li>
              <label class="cfg-item">
                <span class="cfg-item__body">
                  <span class="cfg-item__title">Mensajes de estudiantes</span>
                  <span class="cfg-item__desc">Notificarme cuando reciba mensajes de estudiantes</span>
                </span>
                <input
                  type="checkbox"
                  [ngModel]="notifications().studentMessages"
                  (ngModelChange)="updateStudentMessages($event)"
                  name="studentMessages"
                />
              </label>
            </li>
          </ul>
        </section>

        <div class="cfg-actions">
          <button type="submit" class="prof-btn prof-btn--solid" [disabled]="isSaving()">
            @if (isSaving()) {
              Guardando…
            } @else {
              Guardar configuración
            }
          </button>
        </div>
      </form>
    }
  </div>
</div>
