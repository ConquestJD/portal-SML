<div class="configuracion-admin-container">
  <div class="page-header">
    <h1 class="page-title">Configuración General del Colegio</h1>
    <p class="page-subtitle">Gestiona la configuración institucional</p>
  </div>

  <form (ngSubmit)="saveSettings()" class="settings-form">
    <div class="form-section">
      <h2 class="section-title">Datos del Colegio</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nombre del Colegio</label>
          <input type="text" class="form-input" [(ngModel)]="schoolData().name" name="name">
        </div>
        <div class="form-group">
          <label class="form-label">Dirección</label>
          <input type="text" class="form-input" [(ngModel)]="schoolData().address" name="address">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-input" [(ngModel)]="schoolData().phone" name="phone">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" [(ngModel)]="schoolData().email" name="email">
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Guardar Configuración
      </button>
    </div>
  </form>
</div>
