<div class="adm-page">

  <header class="adm-page__hero">
    <img class="adm-page__hero-photo" src="/images/fondo.webp" alt="" decoding="async" />
    <div class="adm-page__hero-veil"></div>
    <div class="adm-page__hero-content">
      <img src="/only-logo.png" alt="" class="adm-page__crest" />
      <div>
        <h1 class="adm-page__title">Configuración del colegio</h1>
        <p class="adm-page__brand">Santa María Laura</p>
      </div>
    </div>
  </header>

  <div class="adm-page__body">
    <form class="id-form feed" (ngSubmit)="saveSettings()">

      <section class="id-hero-name" aria-labelledby="school-name-label">
        <label class="id-label id-label--hero" id="school-name-label" for="school-name">
          Nombre del colegio
        </label>
        <input
          id="school-name"
          type="text"
          class="id-input id-input--school"
          name="name"
          [ngModel]="schoolData().name"
          (ngModelChange)="patchSchool('name', $event)"
          placeholder="Nombre institucional"
        />
        <p class="id-name-preview" aria-hidden="true">{{ schoolData().name || '—' }}</p>
      </section>

      <section class="id-section">
        <h2 class="id-section__title">Contacto institucional</h2>
        <div class="id-grid">
          <div class="id-field id-field--wide">
            <label class="id-label" for="school-address">Dirección</label>
            <input
              id="school-address"
              type="text"
              class="id-input"
              name="address"
              [ngModel]="schoolData().address"
              (ngModelChange)="patchSchool('address', $event)"
            />
          </div>
          <div class="id-field">
            <label class="id-label" for="school-phone">Teléfono</label>
            <input
              id="school-phone"
              type="tel"
              class="id-input"
              name="phone"
              [ngModel]="schoolData().phone"
              (ngModelChange)="patchSchool('phone', $event)"
            />
          </div>
          <div class="id-field">
            <label class="id-label" for="school-email">Email</label>
            <input
              id="school-email"
              type="email"
              class="id-input"
              name="email"
              [ngModel]="schoolData().email"
              (ngModelChange)="patchSchool('email', $event)"
            />
          </div>
        </div>
      </section>

      <div class="id-actions">
        <button type="submit" class="adm-btn adm-btn--solid">
          Guardar configuración
        </button>
      </div>
    </form>
  </div>
</div>
