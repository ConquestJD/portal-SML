<div class="perfil-admin-container">
  <div class="page-header">
    <h1 class="page-title">Mi Perfil</h1>
    <p class="page-subtitle">Gestiona tu información personal</p>
  </div>

  <form (ngSubmit)="saveProfile()" class="profile-form">
    <div class="form-section">
      <h2 class="section-title">Información Personal</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-input" [(ngModel)]="adminData().name" name="name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" [(ngModel)]="adminData().email" name="email">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-input" [(ngModel)]="adminData().phone" name="phone">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Cambiar Contraseña</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Contraseña Actual</label>
          <input type="password" class="form-input" name="currentPassword">
        </div>
        <div class="form-group">
          <label class="form-label">Nueva Contraseña</label>
          <input type="password" class="form-input" name="newPassword">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar Nueva Contraseña</label>
          <input type="password" class="form-input" name="confirmPassword">
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Guardar Cambios
      </button>
    </div>
  </form>
</div>
