<div class="matricula-container">
  <div class="page-header">
    <h1 class="page-title">Matrícula / Asignación de Sección</h1>
    <p class="page-subtitle">Gestiona la matrícula y asignación de estudiantes a secciones</p>
  </div>

  <form (ngSubmit)="enrollStudent()" class="enrollment-form">
    <div class="form-section">
      <h2 class="section-title">Datos de Matrícula</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Estudiante *</label>
          <input type="text" class="form-input" [(ngModel)]="formData().studentId" name="studentId" placeholder="Buscar estudiante..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Año Académico *</label>
          <select class="form-input" [(ngModel)]="formData().academicYear" name="academicYear" required>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Grado *</label>
          <select class="form-input" [(ngModel)]="formData().grade" name="grade" required>
            <option value="">Seleccionar</option>
            <option value="1ro">1ro</option>
            <option value="2do">2do</option>
            <option value="3ro">3ro</option>
            <option value="4to">4to</option>
            <option value="5to">5to</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Sección *</label>
          <select class="form-input" [(ngModel)]="formData().section" name="section" required>
            <option value="">Seleccionar</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary">Cancelar</button>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Matricular
      </button>
    </div>
  </form>
</div>
