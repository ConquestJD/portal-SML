<aside class="sidebar" [class.collapsed]="isMenuOpen()">
  <div class="sidebar-header">
    <a [routerLink]="userRole() === 'profesor' ? '/profesor/dashboard' : userRole() === 'admin' ? '/admin/dashboard' : '/dashboard'" class="logo-link">
      <img src="/only-logo.png" alt="Santa María Laura" class="logo-image">
      <span class="logo-text">Portal SML</span>
    </a>
    <button class="sidebar-toggle" (click)="toggleMenu()" aria-label="Toggle sidebar">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <div class="sidebar-content">
    <nav class="sidebar-nav">
      @for (item of navigationItems(); track item.path) {
        <a 
          [routerLink]="item.path" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{exact: item.exact !== false}"
          class="nav-link">
          <i [class]="item.icon + ' nav-icon'"></i>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-section">
        <img [src]="userPhoto()" [alt]="userName()" class="user-avatar">
        <div class="user-info">
          <span class="user-name">{{ userName() }}</span>
          <span class="user-role">
            @if (userRole() === 'profesor') {
              Profesor
            } @else if (userRole() === 'admin') {
              Administrador
            } @else {
              Estudiante
            }
          </span>
        </div>
      </div>
      <div class="sidebar-actions">
        <a [routerLink]="userRole() === 'profesor' ? '/profesor/perfil' : userRole() === 'admin' ? '/admin/perfil' : '/perfil'" class="action-link" title="Mi Perfil">
          <i class="fas fa-user"></i>
        </a>
        <a [routerLink]="userRole() === 'profesor' ? '/profesor/configuracion' : userRole() === 'admin' ? '/admin/configuracion' : '/configuracion'" class="action-link" title="Configuración">
          <i class="fas fa-cog"></i>
        </a>
        <a (click)="logout()" class="action-link" title="Cerrar Sesión" style="cursor: pointer;">
          <i class="fas fa-sign-out-alt"></i>
        </a>
      </div>
    </div>
  </div>
</aside>
