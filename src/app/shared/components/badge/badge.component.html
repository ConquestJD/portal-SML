<span class="badge" 
      [attr.data-variant]="variant"
      [attr.data-size]="size"
      [attr.aria-label]="label">
  @if (dot) {
    <span class="badge-dot" aria-hidden="true"></span>
  }
  @if (icon) {
    <i [class]="icon" class="badge-icon" aria-hidden="true"></i>
  }
  <span class="badge-label">{{ label }}</span>
</span>
