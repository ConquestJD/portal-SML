<div class="table-list-wrapper">
  @if (loading) {
    <div class="table-loading">
      @for (col of columns; track col.key) {
        <app-skeleton [width]="col.width || '100%'" height="2rem" variant="rectangular"></app-skeleton>
      }
    </div>
  } @else if (rows.length === 0) {
    <app-empty-state
      icon="fas fa-inbox"
      [title]="emptyMessage || 'No hay datos'"
      description="No se encontraron elementos para mostrar">
    </app-empty-state>
  } @else {
    <div class="table-list" role="table" aria-label="Tabla de datos">
      <!-- Header -->
      <div class="table-header" role="rowgroup">
        <div class="table-row table-row-header" role="row">
          @for (column of columns; track column.key) {
            <div 
              class="table-cell table-cell-header"
              [style.width]="column.width"
              role="columnheader">
              {{ column.label }}
            </div>
          }
        </div>
      </div>

      <!-- Body -->
      <div class="table-body" role="rowgroup">
        @for (row of rows; track $index) {
          <div 
            class="table-row"
            [class.clickable]="clickable || onRowClick"
            (click)="onRowClick && onRowClick(row)"
            role="row"
            [attr.aria-label]="'Fila ' + ($index + 1)">
            @for (column of columns; track column.key) {
              <div 
                class="table-cell"
                [style.width]="column.width"
                role="cell">
                <ng-container [ngSwitch]="column.key">
                  <ng-container *ngSwitchDefault>
                    {{ row[column.key] }}
                  </ng-container>
                </ng-container>
              </div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
